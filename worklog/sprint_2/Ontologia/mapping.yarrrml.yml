prefixes:
  ex: "http://www.progetto-shell.org/dati-cultura-ontology#"
  data: "http://www.progetto-shell.org/data/"
  xsd: "http://www.w3.org/2001/XMLSchema#"

mappings:

  painting:
    sources:
      - ['paintings.csv~csv']
    s: data:artwork-$(codice_opera)
    po:
      - [a, ex:Painting]
      - [ex:hasCode, $(codice_opera)]
      - [ex:hasTitle, $(titolo_opera)]
      - [ex:hasDescription, $(descrizione_opera)]
      - p: ex:isHostedIn
        o:
          mapping: institute
          condition:
            function: equal
            parameters:
              - [str1, $(codice_luogo_istituto)]
              - [str2, $(codice_luogo_istituto)]
      - p: ex:hasTimeReference
        o:
          mapping: exact_date
          condition:
            function: equal
            parameters:
              - [str1, $(codice_opera)]
              - [str2, $(codice_opera)]
      - p: ex:hasTimeReference
        o:
          mapping: year_range
          condition:
            function: equal
            parameters:
              - [str1, $(codice_opera)]
              - [str2, $(codice_opera)]
      - p: ex:hasTimeReference
        o:
          mapping: century_reference
          condition:
            function: equal
            parameters:
              - [str1, $(codice_opera)]
              - [str2, $(codice_opera)]

  institute:
    sources:
      - ['institutes.csv~csv']
    s: data:institute-$(codice_luogo_istituto)
    po:
      - [a, ex:CulturalInstituteOrSite]
      - [ex:hasCode, $(codice_luogo_istituto)]
      - [ex:hasName, $(nome_luogo_istituto)]
      - p: ex:isLocatedIn
        o:
          mapping: place
          condition:
            function: equal
            parameters:
              - [str1, $(codice_istat_luogo)]
              - [str2, $(codice_istat_luogo)]

  place:
    sources:
      - ['places.csv~csv']
    s: data:place-$(codice_istat_luogo)
    po:
      - [a, ex:Place]
      - [ex:hasISTATCode, $(codice_istat_luogo)]
      - [ex:hasName, $(nome_luogo)]

  exact_date:
    sources:
      - ['exact_dates.csv~csv']
    s: data:timeref-date-$(data)
    po:
      - [a, ex:ExactDate]
      - [ex:hasDate, $(data), xsd:date]
      - [ex:hasEDTFValue, $(edtf)]

  year_range:
    sources:
      - ['year_ranges.csv~csv']
    s: data:timeref-yearrange-$(anno_inizio)-$(anno_fine)
    po:
      - [a, ex:YearRange]
      - [ex:hasStartYear, $(anno_inizio), xsd:gYear]
      - [ex:hasEndYear, $(anno_fine), xsd:gYear]
      - [ex:hasEDTFValue, $(edtf)]

  century_reference:
    sources:
      - ['century_references.csv~csv']
    s: data:timeref-century-$(numero_secolo)-$(parte_secolo_uri)
    po:
      - [a, ex:CenturyReference]
      - [ex:hasCenturyNumber, $(numero_secolo), xsd:integer]
      - [ex:hasCenturyPart, $(parte_secolo)]
      - [ex:hasEDTFValue, $(edtf)]
